[build-system]
# Cap setuptools so a future breaking major cannot sneak into isolated builds;
# floor is high enough for pyproject/package-data support used by this package.
requires = ["setuptools>=68,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-mcp"
version = "0.5.13"
description = "Neo MCP server — bring Neo, the autonomous AI engineer for ML, LLM, GenAI & data workflows, into Claude Code, Cursor, Codex & other editors. Describe a task; Neo builds it and writes results to your repo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<4"
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "neo",
    "claude-code", "cursor", "codex", "windsurf",
    "ai", "ml", "machine-learning", "deep-learning", "data-science",
    "llm", "generative-ai", "rag", "ai-agent", "fine-tuning",
    "computer-vision", "pytorch", "huggingface", "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Major caps on every direct dep so open floors cannot pull breaking majors
    # (e.g. mcp 2.0.0 broke the v1 Server/stdio API this package imports).
    # Floors track the mcp 1.28+ support line and that package's own mins.
    "mcp>=1.28,<2",
    "httpx>=0.28.0,<1",
    "anyio>=4.5,<5",
    # pydantic + typing_inspection are pulled in transitively by `mcp`, but we
    # declare them explicitly so a partial/resolver-skipped install can't leave
    # pydantic importable-but-broken (missing typing_inspection) — which crashes
    # the stdio server at import time and surfaces as "-32000 / Connection closed".
    "pydantic>=2.11,<3",
    "typing_inspection>=0.4.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "keyring>=25.0,<26",
]
keyring = [
    "keyring>=25.0,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://heyneo.com"
Repository = "https://github.com/NeoResearchAI/MCPServer"
Documentation = "https://docs.heyneo.com/neo-mcp"
"Bug Tracker" = "https://github.com/NeoResearchAI/MCPServer/issues"

[project.scripts]
neo-mcp = "neo_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neo_mcp = ["skills/*.md", "postman/*.md"]
